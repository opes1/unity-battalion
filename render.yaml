services:
  - type: web
    name: unity-battalion
    runtime: python
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput --clear &&
      python manage.py migrate &&
      python manage.py create_superuser_auto
    startCommand: gunicorn unity_battalion.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: unity_battalion.settings
